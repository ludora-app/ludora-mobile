name: CI/CD Pipeline

on:
  push:
    branches: [main, staging, develop]

jobs:
  # ==========================================
  # 1. GÉNÉRATION API, VALIDATION, RELEASE & BUILD
  # ==========================================
  release:
    name: 🚀 Generate, Validate & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🧰 Setup Ludora (deps, API, translations, icons)
        uses: ./.github/actions/setup-ludora
        with:
          api-env: ${{ secrets.EXPO_PUBLIC_API_ENV }}
          gh-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          vault-addr: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}

      - name: 🛠️ Run checks (Lint & Type Check)
        run: bun run check:all

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: 🚀 Run Semantic Release
        id: semantic
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          bun run release
          NEW_VERSION=$(node -p "require('./package.json').version")
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "✅ New version detected: $NEW_VERSION"
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
            echo "⏭️ No new version detected"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🔍 Check versions before build
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.event_name == 'push'
        run: |
          echo "Package version: $(node -p "require('./package.json').version")"
          echo "Expo version: $(node -p "require('./app.json').expo.version")"

      - name: 🏗️ Setup Expo / EAS
        if: steps.semantic.outputs.new_release == 'true' && github.event_name == 'push' && ((github.ref == 'refs/heads/main' && vars.ENABLE_EXPO_BUILD_PROD == 'true') || (github.ref == 'refs/heads/staging' && vars.ENABLE_EXPO_BUILD_PREVIEW == 'true'))
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Build Android Production (EAS)
        if: vars.ENABLE_EXPO_BUILD_PROD == 'true' && steps.semantic.outputs.new_release == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: bun run build:android:prod --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          EXPO_PUBLIC_API_ENV: ${{ secrets.EXPO_PUBLIC_API_ENV }}

      - name: 🍎 Build iOS Production (EAS)
        if: vars.ENABLE_EXPO_BUILD_PROD == 'true' && steps.semantic.outputs.new_release == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: bun run build:ios:prod --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          EXPO_PUBLIC_API_ENV: ${{ secrets.EXPO_PUBLIC_API_ENV }}

      - name: 📦 Build Android Preview (EAS - staging)
        if: vars.ENABLE_EXPO_BUILD_PREVIEW == 'true' && steps.semantic.outputs.new_release == 'true' && github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: bun run build:android:preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          EXPO_PUBLIC_API_ENV: ${{ secrets.EXPO_PUBLIC_API_ENV }}

      - name: 🍎 Build iOS Preview (EAS - staging)
        if: vars.ENABLE_EXPO_BUILD_PREVIEW == 'true' && steps.semantic.outputs.new_release == 'true' && github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: bun run build:ios:preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          EXPO_PUBLIC_API_ENV: ${{ secrets.EXPO_PUBLIC_API_ENV }}

  # ==========================================
  # 2. SYNCHRONISATION DES BRANCHES (Force Sync)
  # ==========================================
  sync-branches:
    name: 🔄 Sync main -> staging -> develop
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: 🔄 Sync staging with main
        run: |
          git fetch origin main staging
          git checkout staging
          git merge origin/main -m "chore: sync main into staging [skip ci]"
          git push origin staging
          echo "✅ Merged main into staging [skip ci]"

      - name: 🔄 Sync develop with staging
        run: |
          git fetch origin staging develop
          git checkout develop
          git merge origin/staging -m "chore: sync staging into develop [skip ci]"
          git push origin develop
          echo "✅ Merged staging into develop [skip ci]"
