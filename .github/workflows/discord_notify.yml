name: Discord Sync Notification

on:
  push:
    branches:
      - main
      - develop
      - staging

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1 | tr -d '"' | tr -d "'")

          if [ "$BRANCH" = "main" ]; then COLOR=15158332;
          elif [ "$BRANCH" = "staging" ]; then COLOR=15105570;
          else COLOR=3447003;
          fi

          TICKET=$(echo "$BRANCH $MSG" | grep -oE "SCRUM-[0-9]+" | head -1 || echo "")
          if [ -n "$TICKET" ]; then
            JIRA_LINK="🔗 **Jira :** [$TICKET](https://hichemamir398-1740388314640.atlassian.net/browse/$TICKET)"
          else
            JIRA_LINK="🔗 **Jira :** Aucun ticket détecté"
          fi

          curl -X POST -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"🚀 Nouveau Push sur $BRANCH\",
              \"description\": \"💡 **Message :**\n> $MSG\n\n $JIRA_LINK\",
              \"color\": $COLOR,
              \"fields\": [
                { \"name\": \"🌿 Repo\", \"value\": \"\`$REPO\`\", \"inline\": true },
                { \"name\": \"👤 Auteur\", \"value\": \"**$AUTHOR**\", \"inline\": true }
              ],
              \"footer\": { \"text\": \"Ludora App Frontend\" },
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" $DISCORD_WEBHOOK
